<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#11161f" />
    <title>Zombie Fuckers</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" />
    <style>
      /* Soft night-ops HUD: frosted rounded panels floating over the city, a
         slim tool rail on the right that unfolds into a grid, numbers in mono. */
      :root {
        --bg: #11161f;
        --glass: rgba(20, 26, 40, 0.78);
        --glass-2: rgba(30, 38, 58, 0.9);
        --line: rgba(255, 255, 255, 0.08);
        --line-2: rgba(255, 255, 255, 0.16);
        --text: #e8ecf4;
        --muted: #8e9ab2;
        --gold: #ffcf5c;
        --zombie: #8dff6a;
        --rose: #ff6fae;
        --violet: #9c86ff;
        --teal: #3fe0c5;
        --sky: #6fb6ff;
        --danger: #ff6b61;
        --r: 16px;
        --r-sm: 11px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
        --ui: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --display: 'Rubik', 'Nunito', system-ui, sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
        color-scheme: dark;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
        font: 600 14px/1.4 var(--ui); user-select: none; -webkit-user-select: none; }
      button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
      button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
      button { transition: background-color .18s ease, transform .12s ease, opacity .18s ease, border-color .18s ease; }
      button:active:not(:disabled) { transform: scale(.96); }
      .hidden { display: none !important; }
      .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

      #game { position: fixed; inset: 0; }
      #game canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #top { touch-action: none; }
      .glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
        backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2); }
      .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 800; }

      /* top: stats + budget on the left, view buttons on the right */
      .hud-top { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: flex-start; pointer-events: none;
        padding-top: calc(10px + env(safe-area-inset-top, 0px));
        padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
      .hud-top > * { pointer-events: auto; }
      .stats { padding: 10px 14px; min-width: 200px; }
      .stats .title { font: 700 15px/1.2 var(--display); }
      .stats .phase { color: var(--gold); font-size: 12px; margin: 2px 0 6px; font-weight: 800; }
      .stats .money { font: 600 24px/1.1 var(--mono); color: var(--gold); }
      .stats .bounty { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
      .stats .rowv { display: flex; justify-content: space-between; gap: 14px; font-size: 13px; }
      .c-civ { color: #f4f4ef; } .c-zom { color: var(--zombie); } .c-inf { color: #e8f0a8; } .c-evac { color: var(--teal); } .c-rec { color: var(--sky); }
      .spacer { flex: 1; }
      .btns { display: flex; gap: 6px; }
      .sq { width: 42px; height: 42px; display: grid; place-items: center; font-size: 18px; }

      /* selected unit card: left, under the stats */
      .unit { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: calc(196px + env(safe-area-inset-top, 0px)); width: 248px; overflow: hidden; }
      .unit .head { background: linear-gradient(135deg, #ff6fae, #c05bff); color: #fff; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font: 700 15px/1.2 var(--display); }
      .unit .head small { font: 600 11px var(--mono); opacity: .9; }
      .unit .body { padding: 10px 12px 6px; display: grid; gap: 6px; }
      .gauge { display: grid; grid-template-columns: 78px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
      .gauge .track { height: 6px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; }
      .gauge .fill { height: 100%; background: linear-gradient(90deg, #ff6fae, #c05bff); border-radius: 6px; transition: width .3s ease; }
      .unit .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px 12px 12px; }
      .unit .acts button { background: rgba(255,255,255,.06); border-radius: var(--r-sm); padding: 8px 6px; font-size: 12px; text-align: center; font-weight: 800; }
      .unit .acts .up { background: rgba(255,207,92,.16); color: var(--gold); }
      .unit .acts button:disabled { opacity: .4; }
      .unit .tip { color: var(--muted); font-size: 11px; }

      /* right rail of tool groups, unfolding into a grid of cells */
      .rail { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; gap: 8px; padding: 8px; }
      .rail button { width: 58px; height: 58px; border-radius: 14px; display: grid; place-items: center; gap: 0; background: rgba(255,255,255,.05); position: relative; }
      .rail button svg { width: 24px; height: 24px; }
      .rail button span { font-size: 9.5px; font-weight: 800; letter-spacing: .02em; color: var(--muted); margin-top: -6px; }
      .rail button.open { background: rgba(255,255,255,.16); }
      .rail button.has::after { content: ""; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
      .flyout { position: absolute; right: calc(max(10px, env(safe-area-inset-right, 0px)) + 86px); top: 50%; transform: translateY(-50%);
        width: min(300px, calc(100vw - 120px)); padding: 12px; max-height: calc(100% - 140px); overflow-y: auto; animation: fly .18s ease; }
      @keyframes fly { from { opacity: 0; transform: translate(10px, -50%); } to { opacity: 1; transform: translate(0, -50%); } }
      .flyout .label { margin: 0 2px 8px; }
      .cells { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .cell { background: rgba(255,255,255,.05); border: 1px solid transparent; border-radius: 12px; padding: 8px 4px 7px; display: grid; justify-items: center; gap: 3px; text-align: center; position: relative; }
      .cell .ic { width: 22px; height: 22px; border-radius: 8px; box-shadow: 0 0 0 3px rgba(255,255,255,.06); }
      .cell .nm { font-size: 11.5px; line-height: 1.15; font-weight: 800; }
      .cell .cost { font-size: 11px; color: var(--gold); }
      .cell kbd { position: absolute; top: 4px; left: 6px; font: 600 9.5px var(--mono); color: var(--muted); }
      .cell.active { border-color: var(--gold); background: rgba(255,207,92,.12); }
      .cell:disabled { opacity: .35; }
      .toolchip { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: calc(50% + 110px); padding: 6px 10px; font-size: 12px; max-width: 160px; }
      .toolchip b { color: var(--gold); }

      /* bottom: hint in the centre, start / speed dock bottom-right */
      .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        max-width: min(560px, calc(100% - 260px)); text-align: center; padding: 8px 14px; font-size: 12.5px; color: #d8deea; pointer-events: none; transition: opacity .3s ease; }
      .hint.warn { color: #ffd0cc; border-color: rgba(255,107,97,.5); }
      .hint.idle { opacity: 0; }
      .dock { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        display: grid; gap: 6px; padding: 8px; justify-items: stretch; min-width: 180px; }
      .go { background: linear-gradient(135deg, #5a8cff, #7a5cff); color: #fff; border-radius: 13px; padding: 13px 14px; font: 800 15px/1 var(--display); letter-spacing: .04em; box-shadow: 0 6px 18px rgba(90,110,255,.35); }
      .speed { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; background: rgba(255,255,255,.04); border-radius: 12px; padding: 3px; }
      .speed button { border-radius: 9px; padding: 6px 0; font-size: 12px; font-weight: 800; color: var(--muted); }
      .speed button.on { background: rgba(141,255,106,.16); color: var(--zombie); }
      .small { background: rgba(255,255,255,.05); border-radius: 11px; padding: 7px 8px; font-size: 12px; text-align: center; font-weight: 800; }
      .retreat { color: #ffb7b0; }
      .attrib { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(4px + env(safe-area-inset-bottom, 0px)); font-size: 9px; color: rgba(255,255,255,.45); pointer-events: none; }
      .toasts { position: absolute; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: grid; gap: 6px; pointer-events: none; z-index: 2; }
      .toast { padding: 8px 14px; font-size: 13px; animation: toast 3.2s ease forwards; text-align: center; }
      .toast.bad { color: #ffd0cc; } .toast.good { color: #c9ffd9; }
      @keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

      @media (max-width: 760px) {
        .stats { min-width: 0; padding: 8px 11px; }
        .stats .money { font-size: 20px; }
        .stats .rowv { font-size: 12px; }
        .sq { width: 38px; height: 38px; font-size: 16px; }
        .btns { flex-direction: column; }
        .rail { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: none; padding: 6px; }
        .rail button { width: 52px; height: 52px; }
        .flyout { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: none; right: calc(max(10px, env(safe-area-inset-right, 0px)) + 72px); }
        @keyframes fly { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
        .toolchip { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px) - 40px); }
        .unit { top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(232px, calc(100% - 210px)); min-width: 180px; }
        .hint { bottom: auto; top: calc(178px + env(safe-area-inset-top, 0px)); max-width: calc(100% - 24px); font-size: 11.5px; }
        .dock { min-width: 0; width: 176px; }
      }

      /* menu */
      .screen { position: fixed; inset: 0; overflow-y: auto; background: var(--bg);
        padding-block: calc(22px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
        padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
      .screen::before { content: ""; position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(900px 520px at 80% -10%, rgba(141,255,106,.12), transparent 60%), radial-gradient(800px 560px at -10% 110%, rgba(255,111,174,.12), transparent 60%); }
      .wrap { position: relative; max-width: 780px; margin: 0 auto; }
      .logo { display: flex; gap: 14px; align-items: center; }
      .logo img { width: 68px; height: 68px; border-radius: 18px; }
      h1 { font: 800 clamp(32px, 8vw, 50px)/1 var(--display); margin: 0; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
      h1 span { color: var(--zombie); }
      .sub { color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin-top: 6px; font-weight: 800; }
      h2 { font: 800 12px var(--ui); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 28px 0 10px; }
      .lead { color: #c3cbdb; margin: 12px 0 0; max-width: 64ch; font-size: 14px; font-weight: 600; }
      .card { background: var(--glass-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); }
      .card .info { flex: 1; min-width: 0; }
      .card b { font: 700 17px/1.2 var(--display); }
      .card p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
      .card .meta { font-size: 12px; color: #a9b6cc; margin-top: 6px; }
      .stars { color: var(--gold); letter-spacing: 2px; white-space: nowrap; }
      .stars .off { color: #3a4456; }
      .btn { background: linear-gradient(135deg, #5a8cff, #7a5cff); color: #fff; border-radius: 12px; padding: 10px 16px; font-weight: 800; }
      .btn.ghost { background: rgba(255,255,255,.06); color: var(--text); }
      .btn:disabled { opacity: .35; }
      .locked { opacity: .5; }
      .toggle { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
      .switch { width: 50px; height: 30px; border-radius: 30px; background: rgba(255,255,255,.12); position: relative; flex: none; }
      .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s ease; }
      .switch.on { background: var(--zombie); }
      .switch.on::after { transform: translateX(20px); }
      .top { overflow-x: auto; border: 1px solid var(--line); background: var(--glass-2); border-radius: var(--r); }
      .top table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .top th, .top td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
      .top th { color: var(--muted); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
      .top tr:first-child td { color: var(--gold); }

      .modal { position: fixed; inset: 0; background: rgba(6,8,14,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; }
      .modal .box { background: var(--glass-2); border: 1px solid var(--line-2); border-radius: 20px; width: min(440px, 100%); max-height: 100%; overflow-y: auto; box-shadow: var(--shadow); animation: pop .22s ease; }
      @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
      .modal .box .head { background: linear-gradient(135deg, #ff6fae, #c05bff); padding: 14px 18px; font: 800 20px/1.15 var(--display); text-transform: uppercase; }
      .modal .box.win .head { background: linear-gradient(135deg, #3fbf7a, #2fa0c8); }
      .modal .inner { padding: 14px 18px 18px; }
      .big-stars { font-size: 32px; margin: 2px 0 8px; }
      .stat { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
      .actions { display: flex; gap: 8px; margin-top: 16px; }
      .actions .btn { flex: 1; }
      .loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">Загрузка карты Манхэттена…</div>
    <div id="menu" class="screen hidden"></div>
    <div id="game" class="hidden">
      <canvas id="map"></canvas>
      <canvas id="agents"></canvas>
      <canvas id="top"></canvas>
      <div class="hud-top">
        <div class="glass stats" id="stats"></div>
        <div class="spacer"></div>
        <div class="btns">
          <button class="glass sq" id="btn-sound" title="Звук [M]">🔊</button>
          <button class="glass sq" id="btn-rotl" title="Повернуть на 30° [Q]">⟲</button>
          <button class="glass sq" id="btn-rotr" title="Повернуть на 30° [E]">⟳</button>
          <button class="glass sq" id="btn-menu" title="К миссиям">☰</button>
        </div>
      </div>
      <div class="toasts" id="toasts"></div>
      <div class="glass unit hidden" id="sel"></div>
      <div class="glass rail" id="rail"></div>
      <div class="glass flyout hidden" id="flyout"></div>
      <div class="glass toolchip hidden" id="toolchip"></div>
      <div class="glass hint" id="hint"></div>
      <div class="attrib">© OpenStreetMap contributors</div>
      <div class="glass dock" id="dock">
        <button class="go" id="btn-start">НАЧАТЬ</button>
        <button class="small" id="btn-refund">Вернуть всё</button>
        <div class="speed hidden" id="speed">
          <button data-s="0">❚❚</button><button data-s="0.5">½</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button><button data-s="8">8×</button>
        </div>
        <button class="small hidden" id="btn-hunt">К зомби</button>
        <button class="small retreat hidden" id="btn-retreat">Отступить</button>
      </div>
    </div>
    <div id="modal" class="modal hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
